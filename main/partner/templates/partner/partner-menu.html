{% extends "partner/partner-navbar.html" %}

{% block body %}
<div class="partner-menu">
      <div class="partner-menu-buttons">
            <button class="partner-menu-buttons-i" onclick="opencategory(event) ">Add Category +</button>
            <button class="partner-menu-buttons-i" onclick="openitem(event)">Add Item +</button>
            <div class="partner-add-category-div" id="addcategory" onclick="event.stopPropagation()">
                     <h1 class="partner-add-category-div-elem1">Add Category</h1>
                     <form action="POST">
                     {{form.name}}
                     <button class="partner-add-category-div-elem3" name="add_category">confirm</button>
                     </form>
      </div>

             <div class="partner-add-category-div" id="additem" onclick="event.stopPropagation()">
                     
                     <h1 class="partner-add-category-div-elem1">Add Item</h1>
                     <select name="category_id">
                        <option>Select Category</option>
                        {% for i in categories %}
                        <option value="{{i.name}}">{{i.id}}</option>
                        {% endfor%}
                     </select>
                     <form action="POST" enctype="multipart/form-data">
                     {{item_form.name}}
                     {{item_form.price}}
                     {{item_form.description}}
                     {{item_form.food_type}}
                     {{item_form.image}}
                     <button class="partner-add-category-div-elem3" name="add_item">confirm</button>
                     
                     </form>
                  </div>
                  
      </div>
      <div class="partner-menu-data" >
            <div class="partner-menu-data-top">
                  <h1 class="partner-menu-data-top-h">Menu</h1>
                  <img class="partner-menu-data-top-img" src="https://cdn-icons-png.flaticon.com/128/1046/1046747.png">
            </div>
            <hr class="partner-menu-break">

            <div class="partner-menu-data-bottom">
                  <div class="partner-menu-data-category-data">
                        <div class="partner-menu-data-category-data-head">

                              <h1 class="partner-menu-data-category-data-head1">Indian </h1>
                              <img src="https://cdn-icons-png.flaticon.com/128/32/32195.png" class="partner-menu-data-category-data-head2"></img>
                        </div>
                        <div class="partner-menu-data-item-data">
                              <div class="partner-menu-data-item">
                                   <div class="partner-menu-data-item-div1">
                                   <input class="partner-menu-data-item-div1-itemname"  placeholder="Pizza">
                        
                                   <input class="partner-menu-data-item-div1-itemprice" placeholder="$ price"></input>
                                   <textarea class="partner-menu-data-item-div1-itemdescrip" placeholder="description"></textarea>
                                   <select class="partner-menu-data-item-div1-itemtype">
                                    <option>Food type</option>
                                   </select>
                                   <input class="partner-menu-data-item-div1-itemavailable" type="checkbox" >
                              
                                   </div>
                                   <div class="partner-menu-data-item-div1-itemaimage" class="partner-menu-data-item-div2">
                                   <img class="partner-menu-data-item-div1-itemaimage1" src="https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto,w_300,h_300,c_fit/FOOD_CATALOG/IMAGES/CMS/2025/4/17/ef2f1053-c8e3-4072-aaa7-4539a67c8554_e8da5065-4d03-47d7-bad7-5413398a1564.jpg_compressed">
                                   <button class="partner-menu-data-item-div1-itemimgchnge">change image</button>
                                   </div>
                                  


                              </div>
                              <hr class="marging-menu-items">
                              <div class="partner-menu-data-item">
                                   <div class="partner-menu-data-item-div1">
                                   <input class="partner-menu-data-item-div1-itemname"  placeholder="Pizza">
                        
                                   <input class="partner-menu-data-item-div1-itemprice" placeholder="$ price"></input>
                                   <textarea class="partner-menu-data-item-div1-itemdescrip" placeholder="description"></textarea>
                                   <select class="partner-menu-data-item-div1-itemtype">
                                    <option>Food type</option>
                                   </select>
                                   <input class="partner-menu-data-item-div1-itemavailable" type="checkbox" >
                              
                                   </div>
                                   <div class="partner-menu-data-item-div1-itemaimage" class="partner-menu-data-item-div2">
                                   <img class="partner-menu-data-item-div1-itemaimage1" src="https://media-assets.swiggy.com/swiggy/image/upload/fl_lossy,f_auto,q_auto,w_300,h_300,c_fit/FOOD_CATALOG/IMAGES/CMS/2025/4/17/ef2f1053-c8e3-4072-aaa7-4539a67c8554_e8da5065-4d03-47d7-bad7-5413398a1564.jpg_compressed">
                                   <button class="partner-menu-data-item-div1-itemimgchnge">change image</button>
                                   </div>
                                  


                              </div>
                              <div>
                                    
                              </div>
                        </div>

                  </div>
            </div>
      </div>
      
</div>
<script>
     let a =false
      function opencategory(event){
            event.stopPropagation();
            let x=document.getElementById('addcategory')
            let y=document.getElementById('additem')
            
            x.style.display='block'
            y.style.display='none'
            a=true
      }
      function openitem(event){
            event.stopPropagation();
            let x=document.getElementById('addcategory')
            let y=document.getElementById('additem')
            x.style.display='none'
            y.style.display='block'
            a=true
      }

     window.addEventListener('click', function(){
    if(a){
        document.getElementById('addcategory').style.display='none';
        document.getElementById('additem').style.display='none';
        a = false; 
    }
});


      
</script>
{% endblock %}
